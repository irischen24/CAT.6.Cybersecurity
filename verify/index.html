<body>
<div class="c6-root c6-verify-page">
  <div class="c6-bg" aria-hidden="true"><div class="c6-bg__grid"></div></div>
  <header class="c6-vhead">
    <a class="c6-vbrand" href="../index.html" data-brand="lockup" aria-label="CAT.6 Cybersecurity 首頁"></a>
    <span class="c6-vhead__t">Report Verification</span>
  </header>
  <main id="main" class="c6-vmain" tabindex="-1">
    <h1 class="c6-vtitle">報告驗證 Report Verification</h1>
    <form class="c6-vform" id="lookup">
      <label class="c6-field"><span class="c6-var__lbl">Report ID</span><input class="c6-input" id="q-id" required pattern="REP-\d{8}-[0-9A-Z]{5}" placeholder="REP-20260928-X8921"></label>
      <label class="c6-field"><span class="c6-var__lbl">Version</span><input class="c6-input" id="q-v" placeholder="1.0（留白 = 最新版本）"></label>
      <button class="c6-btn c6-btn--primary" type="submit">查詢</button>
    </form>
    <div id="result" aria-live="polite"></div>
  </main>
</div>
